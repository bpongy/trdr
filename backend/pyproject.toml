[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trdr"
version = "0.1.0"
description = "Robot de trading ETH sur compte virtuel Binance (testnet / demo)"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["trdr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
